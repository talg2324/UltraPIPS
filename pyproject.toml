[project]
name = "ultrapips"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "talg" }
]
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "timm>=1.0.12",
]

[project.optional-dependencies]
tusa = ["tusa"]
medsam = ["segment-anything"]
clip = ["open-clip-torch>=3.3.0", "transformers>=5.7.0"]
fid = ["monai>=1.5.2", "tqdm"]
all = ["ultrapips[tusa,medsam,clip,fid]"]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
tusa = { git = "https://github.com/talg2324/tusa.git" }
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }

[tool.uv.workspace]
members = [
    "experiments",
    ".",
    "experiments/assets/data/covid19_ultrasound/pocovidnet",
]
